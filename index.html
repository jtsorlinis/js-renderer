<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/js-renderer/favicon.svg" />
    <!-- Adds the cross-origin isolation headers GitHub Pages can't send, so SharedArrayBuffer works -->
    <script src="/js-renderer/coi-serviceworker.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software Renderer</title>
    <script type="module" crossorigin src="/js-renderer/assets/index-DMjg0GW5.js"></script>
    <link rel="stylesheet" crossorigin href="/js-renderer/assets/index-DcpHtBMS.css">
  </head>
  <body>
    <div class="viewport">
      <canvas id="canvas"></canvas>
    </div>

    <aside class="sidebar">
      <header class="brand hideMobile">
        <img class="brand-logo" src="/js-renderer/favicon.svg" alt="" width="32" height="32" />
        <div>
          <h1 class="brand-title">Software Renderer</h1>
          <p class="brand-subtitle">CPU rasterizer in TypeScript</p>
        </div>
      </header>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Frame</span>
          <span class="stat-value"><span id="frameTime">0</span><span class="stat-unit">ms</span></span>
        </div>
        <div class="stat">
          <span class="stat-label">FPS</span>
          <span class="stat-value" id="fps">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Triangles</span>
          <span class="stat-value" id="tris">0</span>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <span class="section-heading">Model</span>
          <button type="button" class="text-button hideMobile" id="loadGlbBtn">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" />
            </svg>
            Load GLB
          </button>
          <input id="glbInput" type="file" accept=".glb,model/gltf-binary" hidden />
        </div>

        <div class="model-grid" id="modelGrid">
          <button type="button" class="model-tile" data-model="dice" aria-pressed="false">
            <img src="/js-renderer/thumbnails/dice.webp" alt="" width="160" height="160" />
            <span class="model-name">Dice</span>
            <span class="model-faces">20 faces</span>
          </button>
          <button type="button" class="model-tile" data-model="can" aria-pressed="false">
            <img src="/js-renderer/thumbnails/can.webp" alt="" width="160" height="160" />
            <span class="model-name">Can</span>
            <span class="model-faces">500 faces</span>
          </button>
          <button type="button" class="model-tile" data-model="hydrant" aria-pressed="false">
            <img src="/js-renderer/thumbnails/hydrant.webp" alt="" width="160" height="160" />
            <span class="model-name">Hydrant</span>
            <span class="model-faces">3k faces</span>
          </button>
          <button type="button" class="model-tile" data-model="head" aria-pressed="false">
            <img src="/js-renderer/thumbnails/head.webp" alt="" width="160" height="160" />
            <span class="model-name">Head</span>
            <span class="model-faces">10k faces</span>
          </button>
          <button type="button" class="model-tile" data-model="dragon" aria-pressed="false">
            <img src="/js-renderer/thumbnails/dragon.webp" alt="" width="160" height="160" />
            <span class="model-name">Dragon</span>
            <span class="model-faces">30k faces</span>
          </button>
          <button type="button" class="model-tile" data-model="demon" aria-pressed="false">
            <img src="/js-renderer/thumbnails/demon.webp" alt="" width="160" height="160" />
            <span class="model-name">Demon</span>
            <span class="model-faces">100k faces</span>
          </button>
        </div>
      </div>

      <div class="section">
        <span class="section-heading">Shading</span>

        <div class="shading-picker">
          <ul class="shading-list" id="shadingList">
            <li>
              <button
                type="button"
                class="shading-option is-active"
                data-shading-index="10"
                data-shading-value="tonemapped-ibl"
                aria-pressed="true"
              >
                Tonemapping
              </button>
            </li>
            <li>
              <button
                type="button"
                class="shading-option"
                data-shading-index="9"
                data-shading-value="ibl"
                aria-pressed="false"
              >
                Environment
              </button>
            </li>
            <li>
              <button
                type="button"
                class="shading-option"
                data-shading-index="8"
                data-shading-value="pbr"
                aria-pressed="false"
              >
                Materials
              </button>
            </li>
            <li>
              <button
                type="button"
                class="shading-option"
                data-shading-index="7"
                data-shading-value="normalMapped-shadows"
                aria-pressed="false"
              >
                Shadows
              </button>
            </li>
            <li>
              <button
                type="button"
                class="shading-option"
                data-shading-index="6"
                data-shading-value="normalMapped"
                aria-pressed="false"
              >
                Normals
              </button>
            </li>
            <li>
              <button
                type="button"
                class="shading-option"
                data-shading-index="5"
                data-shading-value="textured"
                aria-pressed="false"
              >
                Textures
              </button>
            </li>
            <li>
              <button
                type="button"
                class="shading-option"
                data-shading-index="4"
                data-shading-value="smooth"
                aria-pressed="false"
              >
                Smoothing
              </button>
            </li>
            <li>
              <button
                type="button"
                class="shading-option"
                data-shading-index="3"
                data-shading-value="flat"
                aria-pressed="false"
              >
                Lighting
              </button>
            </li>
            <li>
              <button
                type="button"
                class="shading-option"
                data-shading-index="2"
                data-shading-value="unlit"
                aria-pressed="false"
              >
                Fill
              </button>
            </li>
            <li>
              <button
                type="button"
                class="shading-option"
                data-shading-index="1"
                data-shading-value="depthWireframe"
                aria-pressed="false"
              >
                Depth
              </button>
            </li>
            <li>
              <button
                type="button"
                class="shading-option"
                data-shading-index="0"
                data-shading-value="wireframe"
                aria-pressed="false"
              >
                Wireframe
              </button>
            </li>
          </ul>

          <input
            id="shadingSlider"
            class="shading-slider hideMobile"
            type="range"
            min="0"
            max="10"
            step="1"
            value="10"
            aria-label="Shading"
          />
        </div>
      </div>

      <div class="section">
        <span class="section-heading">Options</span>
        <div class="toggles">
          <label class="toggle">
            Orthographic
            <input type="checkbox" role="switch" id="orthoCb" />
          </label>
          <label class="toggle">
            Multithreaded
            <input type="checkbox" role="switch" id="workersCb" checked />
          </label>
        </div>
      </div>

      <footer class="sidebar-footer hideMobile">
        <dl class="controls">
          <div><dt>Rotate</dt><dd><kbd>Drag</kbd></dd></div>
          <div><dt>Pause</dt><dd><kbd>Space</kbd></dd></div>
          <div><dt>Pan</dt><dd><kbd>Right-drag</kbd></dd></div>
          <div><dt>Model</dt><dd><kbd>←</kbd><kbd>→</kbd></dd></div>
          <div><dt>Zoom</dt><dd><kbd>Scroll</kbd></dd></div>
          <div><dt>Shading</dt><dd><kbd>↑</kbd><kbd>↓</kbd></dd></div>
        </dl>
      </footer>
    </aside>

  </body>
</html>
