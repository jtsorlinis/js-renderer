<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/js-renderer/journey/favicon.svg" />
    <!-- Adds the cross-origin isolation headers GitHub Pages can't send, so SharedArrayBuffer works -->
    <script src="/js-renderer/journey/coi-serviceworker.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rendering Journey</title>
    <script type="module" crossorigin src="/js-renderer/journey/assets/index-BZcikfbp.js"></script>
    <link rel="stylesheet" crossorigin href="/js-renderer/journey/assets/index-82tfrRUk.css">
  </head>
  <body>
    <div class="viewport">
      <canvas id="canvas"></canvas>
    </div>

    <aside class="sidebar">
      <header class="brand hideMobile">
        <img class="brand-logo" src="/js-renderer/journey/favicon.svg" alt="" width="32" height="32" />
        <div>
          <h1 class="brand-title">Rendering Journey</h1>
          <p class="brand-subtitle">CPU rasterizer in TypeScript</p>
        </div>
      </header>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Frame</span>
          <span class="stat-value"><span id="frameTime">0</span><span class="stat-unit">ms</span></span>
        </div>
        <div class="stat">
          <span class="stat-label">FPS</span>
          <span class="stat-value" id="fps">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Triangles</span>
          <span class="stat-value" id="tris">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Resolution</span>
          <span class="stat-value" id="resolution">0p</span>
        </div>
      </div>

      <div class="section">
        <span class="section-heading">Shading</span>

        <div class="shading-picker">
          <ul class="shading-list" id="shadingList"></ul>

          <input
            id="shadingSlider"
            class="shading-slider hideMobile"
            type="range"
            min="0"
            max="10"
            step="1"
            value="10"
            aria-label="Shading"
          />
        </div>
      </div>

      <footer class="sidebar-footer hideMobile">
        <dl class="controls">
          <div><dt>Rotate</dt><dd><kbd>Drag</kbd></dd></div>
          <div><dt>Pan</dt><dd><kbd>Right-drag</kbd></dd></div>
          <div><dt>Zoom</dt><dd><kbd>Scroll</kbd></dd></div>
          <div><dt>Shading</dt><dd><kbd>↑</kbd><kbd>↓</kbd></dd></div>
        </dl>
      </footer>
    </aside>

  </body>
</html>
